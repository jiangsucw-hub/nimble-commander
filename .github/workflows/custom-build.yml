name: custom-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | head -20
          uname -m

      - name: Build (unsigned)
        working-directory: Source/NimbleCommander
        run: |
          xcodebuild \
            -project NimbleCommander.xcodeproj \
            -scheme NimbleCommander-Unsigned \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/build.log" | tail -200

      - name: Package
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release/NimbleCommander-Unsigned.app"
          ls -la "$(dirname "$APP")"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/NimbleCommander-Unsigned.zip"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NimbleCommander-Unsigned
          path: |
            ${{ runner.temp }}/NimbleCommander-Unsigned.zip
            ${{ runner.temp }}/build.log
          retention-days: 14
          if-no-files-found: warn
