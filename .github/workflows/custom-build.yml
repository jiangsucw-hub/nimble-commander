name: custom-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | head -20
          uname -m

      - name: Resolve product path
        id: product
        working-directory: Source/NimbleCommander
        run: |
          xcodebuild \
            -project NimbleCommander.xcodeproj \
            -scheme NimbleCommander-Unsigned \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -showBuildSettings 2>/dev/null |
            grep -E "^\s*(BUILT_PRODUCTS_DIR|FULL_PRODUCT_NAME|PRODUCT_NAME|CONFIGURATION_BUILD_DIR|SYMROOT) =" |
            sort -u

      - name: Build (unsigned)
        working-directory: Source/NimbleCommander
        run: |
          set -o pipefail
          xcodebuild \
            -project NimbleCommander.xcodeproj \
            -scheme NimbleCommander-Unsigned \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -300

      - name: Package
        run: |
          echo "--- products tree ---"
          ls -la "$RUNNER_TEMP/dd/Build/Products/Release" || true
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle produced"
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 | head -50
            exit 1
          fi
          echo "packaging: $APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/NimbleCommander-Unsigned.zip"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NimbleCommander-Unsigned
          path: |
            ${{ runner.temp }}/NimbleCommander-Unsigned.zip
            ${{ runner.temp }}/build.log
          retention-days: 14
          if-no-files-found: warn
